<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>뉴스 뒤의 주식 · 3초 퀴즈</title>
<style>
:root {
  --navy: #0f1a2c; --navy2: #17263f; --ink: #e9eef6; --ink2: #aabdd3; --gold: #d4af37; --risk: #d98c8c;
  --f-body: "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
  --f-data: "DejaVu Sans Mono", "IBM Plex Mono", monospace;
}
html, body { margin: 0; padding: 0; background: #000; }
.frame { position: relative; width: 1080px; aspect-ratio: 9 / 16; overflow: hidden; color: var(--ink); font-family: var(--f-body); container-type: inline-size; word-break: keep-all; background: linear-gradient(180deg, #13213a 0%, var(--navy) 100%); }
.f-brand { position: absolute; top: 3.2%; left: 6%; font-size: 3.6cqw; font-weight: 700; color: var(--ink2); letter-spacing: 0.02em; z-index: 5; }
.f-brand b { color: var(--gold); }
.cap { position: absolute; left: 6%; right: 6%; bottom: 7%; min-height: 15%; display: flex; align-items: flex-end; justify-content: center; z-index: 6; }
.cap span { background: rgba(5, 10, 20, 0.78); color: #fff; font-size: 5.1cqw; font-weight: 700; line-height: 1.38; padding: 2.4cqw 3.4cqw; border-radius: 2.4cqw; text-align: center; text-wrap: balance; }
.legal { position: absolute; bottom: 2.4%; left: 0; right: 0; text-align: center; font-size: 2.8cqw; color: var(--ink2); z-index: 6; }
[data-in] { opacity: 0; transform: translateY(2cqw); transition: opacity .45s ease, transform .45s ease; }
[data-in].on { opacity: 1; transform: none; }
.q { position: absolute; top: 9%; left: 6%; right: 6%; z-index: 3; }
.q small { font-family: var(--f-data); color: var(--gold); font-size: 3.2cqw; letter-spacing: .08em; }
.q strong { display: block; font-size: 6.6cqw; font-weight: 900; line-height: 1.28; margin-top: 1.4cqw; text-wrap: balance; }
.q strong b { color: var(--gold); }
.q strong .hk { display: block; font-size: 5.6cqw; margin-bottom: .6cqw; }
.opts { position: absolute; top: 33%; left: 6%; right: 6%; display: flex; flex-direction: column; gap: 2.6cqw; z-index: 3; }
.opt { display: flex; align-items: center; gap: 3cqw; background: var(--navy2); border: .5cqw solid #33496d; border-radius: 3cqw; padding: 2.6cqw 3.4cqw; transition: border-color .4s, background-color .4s, opacity .4s, transform .45s; }
.opt .no { flex: none; width: 8cqw; height: 8cqw; border-radius: 50%; background: #2a3d5e; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 4.4cqw; }
.opt .tx b { display: block; font-size: 4.6cqw; line-height: 1.25; }
.opt .tx span { display: block; font-size: 3.2cqw; color: var(--ink2); }
.q, .opts { transition: opacity .4s ease, top .45s ease; }
/* answer screen: drop the situation line and lift the options so the reasons box clears the captions */
.frame.reveal .q strong .hk { display: none; }
.frame.reveal .opts { top: 25%; }
.frame.newsmode .q, .frame.newsmode .opts { opacity: 0; }
.frame.reveal .opt { opacity: .4; }
.frame.reveal .opt.ans { opacity: 1; border-color: var(--gold); background: #2a2210; }
.frame.reveal .opt.ans .no { background: var(--gold); color: #1a1405; }
.count { position: absolute; top: 62%; left: 50%; transform: translateX(-50%); z-index: 4; font-family: var(--f-data); font-size: 16cqw; color: var(--gold); line-height: 1; }
.count[data-in] { transform: translateX(-50%) translateY(2cqw); }
.count[data-in].on { transform: translateX(-50%); }
.news { position: absolute; top: 16%; left: 6%; right: 6%; z-index: 4; background: var(--navy2); border: .5cqw solid #33496d; border-radius: 3.4cqw; padding: 4.4cqw 4.6cqw; }
.news small { font-family: var(--f-data); color: var(--gold); font-size: 3.1cqw; letter-spacing: .06em; }
.news strong { display: block; font-size: 6.4cqw; font-weight: 900; line-height: 1.3; margin-top: 1.6cqw; text-wrap: balance; }
.news ul { margin: 3.2cqw 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1.8cqw; }
.news li { font-size: 4.3cqw; line-height: 1.4; padding-left: 4cqw; position: relative; }
.news li::before { content: ""; position: absolute; left: 0; top: 2.2cqw; width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: var(--gold); }
.news li b { color: var(--gold); }
.news i { display: block; font-style: normal; font-size: 3cqw; color: var(--ink2); margin-top: 3cqw; }
.why { position: absolute; top: 56%; left: 6%; right: 6%; z-index: 4; background: rgba(212, 175, 55, .1); border: .4cqw solid rgba(212, 175, 55, .55); border-radius: 3cqw; padding: 2.6cqw 3.4cqw; font-size: 3.6cqw; line-height: 1.45; }
.why b { display: block; color: var(--gold); margin-bottom: 1.2cqw; }
.why .rs { display: block; font-size: 3.7cqw; line-height: 1.45; }
.why .rs em { font-style: normal; color: var(--gold); font-weight: 700; margin-right: 1cqw; }
.why .r { display: block; color: var(--risk); font-size: 3.1cqw; margin-top: 1cqw; }
.cta { position: absolute; left: 5%; right: 5%; bottom: 6%; z-index: 7; text-align: center; background: linear-gradient(180deg, #2a2210, #1a1405); border: .5cqw solid var(--gold); border-radius: 3.4cqw; padding: 2.6cqw 2cqw; box-shadow: 0 1.5cqw 5cqw rgba(0,0,0,.45); }
.cta b { display: block; color: var(--gold); font-size: 4.5cqw; font-weight: 900; line-height: 1.3; white-space: nowrap; letter-spacing: -0.02em; }
.cta span { display: block; color: #fff; font-size: 3.8cqw; font-weight: 700; margin-top: 1.2cqw; }
.cta i { font-style: normal; font-family: "Noto Color Emoji", sans-serif; }
</style>
</head>
<body>
<div class="frame" id="f"></div>
<script>
// window.QUIZ (content) and window.TL (timeline from the voice clips) are injected by build.py before this script runs.
(function () {
  const Q = window.QUIZ, T = window.TL;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const circled = ['①', '②', '③'];
  const f = document.getElementById('f');
  f.innerHTML = `
    <div class="f-brand">뉴스 뒤의 <b>주식</b> · 3초 퀴즈</div>
    <div class="news" data-in="${T.news}" data-out="${T.ans}"><small>오늘의 뉴스 · ${esc(Q.news.date)}</small><strong>${esc(Q.news.title)}</strong><ul>${Q.news.bullets.map((b) => `<li>${md(b)}</li>`).join('')}</ul><i>출처 ${esc(Q.news.source)}</i></div>
    <div class="q" data-in="0"><small>QUIZ · ${esc(Q.date_label)} 뉴스</small><strong>${Q.hook ? `<span class="hk">${md(Q.hook)}</span>` : ''}${esc(Q.question)}</strong></div>
    <div class="opts">${Q.options.map((o, i) => `<div class="opt${i === Q.options.length - 1 ? ' ans' : ''}" data-in="${T['o' + (i + 1)]}"><span class="no">${i + 1}</span><span class="tx"><b>${esc(o.name)}</b><span>${esc(o.sub)}</span></span></div>`).join('')}</div>
    <div class="count" id="cd" data-in="${T.count}" data-out="${T.count + 3}">3</div>
    <div class="why" data-in="${T.ans}"><b>${esc(Q.why.title)}</b>${Q.why.reasons.map((r, i) => `<span class="rs"><em>${circled[i]}</em> ${esc(r)}</span>`).join('')}<span class="r">${esc(Q.why.risk)}</span></div>
    <div class="cap"><span id="cap"></span></div>
    <div class="cta" data-in="${T.cta}"><b><i>🔔</i> 뉴스 뒤 숨은 종목, 매일 가장 먼저</b><span>팔로우 · 구독하고 받아보세요</span></div>
    <div class="legal">AI 생성 이미지 · 투자 권유가 아닙니다</div>`;
  const els = Array.from(f.querySelectorAll('[data-in]'));
  const cap = document.getElementById('cap'), cd = document.getElementById('cd');
  let last = null;
  window.renderAt = function (t) {
    els.forEach((el) => { const a = parseFloat(el.dataset.in), b = el.dataset.out ? parseFloat(el.dataset.out) : Infinity; el.classList.toggle('on', t >= a && t < b); });
    f.classList.toggle('reveal', t >= T.ans);
    f.classList.toggle('newsmode', t >= T.news && t < T.ans);
    let c = ''; T.captions.forEach((x) => { if (t >= x[0]) c = x[1]; });
    if (c !== last) { cap.textContent = c; cap.style.display = c ? '' : 'none'; last = c; }
    const n = t < T.count ? 3 : Math.max(1, 3 - Math.floor(t - T.count));
    if (cd.textContent !== String(n)) cd.textContent = String(n);
  };
  window.renderAt(0);
})();
</script>
</body>
</html>
